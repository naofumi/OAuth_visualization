name: Pull request build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  npm-build:
    name: npm-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
